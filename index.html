<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Vagha Management System</title>
    <link rel="stylesheet" href="frontend/css/base.css">
    <link rel="stylesheet" href="frontend/css/layout.css">
    <link rel="stylesheet" href="frontend/css/forms.css">
    <link rel="stylesheet" href="frontend/css/buttons.css">
    <link rel="stylesheet" href="frontend/css/entries.css">
    <link rel="stylesheet" href="frontend/css/calendar.css">
    <link rel="stylesheet" href="frontend/css/overlays.css">
    <link rel="stylesheet" href="frontend/css/responsive.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
</head>

<body>

    <header class="app-header">
        <img src="frontend/assets/logo.png" alt="Shree Hanumanji Mandir logo" class="app-logo" onerror="this.style.display='none'">
        <h1>Vagha Management</h1>
    </header>

    <div class="card card--add">
        <h2>
            <span class="section-icon icon-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg></span>
            Add Devotee
        </h2>
        <form id="bookingForm" novalidate>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Full name" autocomplete="name" required>
            <p class="field-error" id="nameError"></p>

            <label for="phone">Phone</label>
            <div class="phone-field">
                <select id="countryCode" class="country-code-select" aria-label="Country code">
                    <option value="+91" selected>+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+65">+65</option>
                    <option value="+971">+971</option>
                </select>
                <input type="tel" id="phone" name="phone" inputmode="numeric" placeholder="10-digit number"
                    maxlength="10" required>
            </div>
            <p class="field-error" id="phoneError"></p>

            <label for="dayType">Day Type</label>
            <select id="dayType" name="dayType">
                <option value="Friday" selected>Friday</option>
                <option value="Special">Special Day</option>
            </select>

            <button type="submit" id="addBtn">Add Devotee</button>
        </form>
    </div>

    <div class="card card--confirmed">
        <h2>
            <span class="section-icon icon-confirmed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
            Confirmed List <span class="count" id="confirmedCount">0</span>
        </h2>
        <ul id="confirmedList">
            <li class="empty-state">No confirmed bookings yet.</li>
        </ul>
    </div>

    <div class="card card--waiting">
        <h2>
            <span class="section-icon icon-waiting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
            Waiting List <span class="count" id="waitingCount">0</span>
        </h2>
        <ul id="waitingList">
            <li class="empty-state">No one is waiting right now.</li>
        </ul>
    </div>

    <div class="card card--calendar">
        <h2>
            <span class="section-icon icon-calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
            Calendar View
        </h2>
        <div id="calendar"></div>
        <div class="calendar-legend">
            <span class="legend-item"><span class="legend-dot legend-dot--today"></span>Today</span>
            <span class="legend-item"><span class="legend-dot legend-dot--next"></span>Next available Friday</span>
            <span class="legend-item"><span class="legend-dot legend-dot--booked"></span>Confirmed booking</span>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <h3 id="modalTitle">Select Date</h3>
            <p class="modal-hint" id="modalSuggestion"></p>
            <label for="modalDate">Vagha date</label>
            <input type="date" id="modalDate">
            <p class="field-error" id="modalDateError"></p>
            <div class="modal-actions">
                <button type="button" id="confirmDateBtn">Confirm Booking</button>
                <button type="button" id="cancelDateBtn" class="secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
        <div class="modal-content">
            <h3 id="editModalTitle">Edit Devotee</h3>

            <label for="editName">Name</label>
            <input type="text" id="editName" autocomplete="name">
            <p class="field-error" id="editNameError"></p>

            <label for="editPhone">Phone</label>
            <div class="phone-field">
                <select id="editCountryCode" class="country-code-select" aria-label="Country code">
                    <option value="+91" selected>+91</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                    <option value="+61">+61</option>
                    <option value="+65">+65</option>
                    <option value="+971">+971</option>
                </select>
                <input type="tel" id="editPhone" inputmode="numeric" placeholder="10-digit number" maxlength="10">
            </div>
            <p class="field-error" id="editPhoneError"></p>

            <label for="editDayType">Day Type</label>
            <select id="editDayType">
                <option value="Friday">Friday</option>
                <option value="Special">Special Day</option>
            </select>

            <div class="modal-actions">
                <button type="button" id="saveEditBtn">Save Changes</button>
                <button type="button" id="cancelEditBtn" class="secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script type="module" src="frontend/js/main.js"></script>
</body>

</html>
