<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d66a0a" />
  <title>Offline | Vagha Management System</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff7ed;
      color: #1f2937;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }

    main {
      max-width: 360px;
    }

    img {
      width: 88px;
      height: 88px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 16px 0 8px;
    }

    p {
      margin: 0 0 20px;
      color: #64748b;
      line-height: 1.5;
    }

    button {
      background: #d66a0a;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #b95700;
    }

    button:focus-visible {
      outline: 3px solid #fb923c;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <main>
    <img src="frontend/assets/logo.png" alt="" />
    <h1>You're offline</h1>
    <p>Vagha bookings are live data, so an internet connection is needed. Please reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>

</html>
